definitions:
  name: 'Simulation data from UU with h5'
  sections:
    Simulation_data_from_UU:
      # Plain EntryData (no ELN base sections): the new NOMAD UI then shows the
      # entry fields (datetime, chemical_formula, ...) read-only instead of as
      # input fields. HDF5Normalizer links the quantities annotated with
      # m_annotations.hdf5.path to datasets in the uploaded .h5 (data_file).
      base_sections:
        - 'nomad.datamodel.data.EntryData'
        - 'nomad.datamodel.metainfo.basesections.HDF5Normalizer'
      quantities:
        name:
          type: str
          default: "UU-DFT+MC-Data"
        description:
          type: str
        lab_id:
          type: str
        short_name:
          type: str
        owner:
          type: str
        chemical_formula:
          type: str
          description: "Chemical formula (from the dataset folder name; omitted when the cif run-section is embedded, then the composition is derived from the structure)"
        data_file:
          type: str
          description: "Name of the uploaded .h5 file in the same upload (raw/); the HDF5Normalizer base section opens it and fills quantities annotated with m_annotations.hdf5.path"
        # Quantity names/units follow the mammos-entity names as-is
        # (Js, Ku, Tc, Ms from intrinsic_properties.yaml); Js_300 is the
        # Js curve interpolated at 300 K from UppASD/MC_1/thermal.csv.
        # Descriptions with ontology label/IRI are filled at runtime from
        # the mammos files / mammos-entity; quantities present in the .h5
        # get m_annotations.hdf5.path and no inline value.
        Js:
          type: np.float32
          unit: T
          defaultDisplayUnit: "T"
        Js_300:
          type: np.float32
          unit: T
          defaultDisplayUnit: "T"
        Ku:
          type: np.float32
          unit: MJ/m^3
          defaultDisplayUnit: "MJ/m^3"
        Tc:
          type: np.float32
          unit: K
          defaultDisplayUnit: "K"
        Ms:
          type: np.float32
          unit: kA/m
          defaultDisplayUnit: "kA/m"
      sub_sections:
        mammos_entities:
          repeats: true
          section:
            quantities:
              name: {type: str}
              value_key: {type: str}
              source_type: {type: str}
              ontology_label: {type: str}
              ontology_iri: {type: str}
              unit: {type: str}
              description: {type: str}
data:
  m_def: Simulation_data_from_UU
  chemical_formula: $chemical_formula$
  data_file: $data_file$
  institute: 'Uppsala University, Department of Physics and Astronomy; Materials Theory'
  lab_id: 'Uppsala_University'
  owner: 'Heike Herper, Mohammad Nur Hassan, Alena Vishina'
  method: 'DFT'
  name: $name$
  short_name: $short_name$

  description: "Data for atomistic and spin-dynamics calculations done within the project MaMMoS at Uppsala University.\nA juypter-notebook showing how to handle the data can be found next to the raw data. \n\nAdditional information on the datasets and corresponding MODA diagrams can be found on https://mammos-project.github.io/resources.html ."

  Js: $Js$
  Js_300: $Js_300$
  Ku: $Ku$
  Tc: $Tc$
  Ms: $Ms$
  mammos_entities: $mammos_entities$
