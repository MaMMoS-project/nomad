definitions:
  name: 'Simulation data from UU with h5'
  sections:
    Simulation_data_from_UU:
      # The ELN 'Chemical' base section (as in the original UU template)
      # provides the chemical_formula quantity; its normalize() populates
      # results.material server-side (elements + formula formats), so the
      # Overview Material section is filled and element search works.
      # Trade-off: ELN base fields (datetime, chemical_formula, ...) are
      # editable input fields in the NOMAD 2.0 UI (accepted, matches the
      # initial datasets). HDF5Normalizer links the quantities annotated with
      # m_annotations.hdf5.path to datasets in the uploaded .h5 (data_file).
      base_sections:
        - 'nomad.datamodel.metainfo.eln.Chemical'
        - 'nomad.datamodel.data.EntryData'
        - 'nomad.datamodel.metainfo.basesections.HDF5Normalizer'
      quantities:
        name:
          type: str
          default: "UU-DFT+MC-Data"
        description:
          type: str
        lab_id:
          type: str
        short_name:
          type: str
        owner:
          type: str
        # Elements of the dataset as a comma-separated STRING, filled from the
        # dataset folder-name formula (same source as the ELN Chemical
        # chemical_formula). Must NOT be a list (shape: ['*']): nomad-lab
        # 2.0.1 HDF5Normalizer.normalize() runs re.match(h5_re, value) on EVERY
        # str-typed quantity of this section — a list value raises
        # "TypeError: expected string or bytes-like object, got 'list'" and
        # aborts the whole section normalize (no hdf5 fill, and the Chemical
        # formula -> results.material population never runs).
        # Independent data-section quantity — no server-side conflict with
        # chemical_formula (the ELN base only reads chemical_formula).
        elements:
          type: str
          description: "Chemical elements of the dataset, comma-separated (from the folder-name formula; omitted when the cif run-section is embedded)"
        data_file:
          type: str
          description: "Name of the uploaded .h5 file in the same upload (raw/); the HDF5Normalizer base section opens it and fills quantities annotated with m_annotations.hdf5.path"
        # Quantity names/units follow the mammos-entity names as-is
        # (Js, Ku, Tc, Ms from intrinsic_properties.yaml); Js_300 is the
        # Js curve interpolated at 300 K from UppASD/MC_1/thermal.csv.
        # Descriptions with ontology label/IRI are filled at runtime from
        # the mammos files / mammos-entity; quantities present in the .h5
        # get m_annotations.hdf5.path and no inline value.
        Js:
          type: np.float32
          unit: T
          defaultDisplayUnit: "T"
        Js_300:
          type: np.float32
          unit: T
          defaultDisplayUnit: "T"
        Ku:
          type: np.float32
          unit: MJ/m^3
          defaultDisplayUnit: "MJ/m^3"
        Tc:
          type: np.float32
          unit: K
          defaultDisplayUnit: "K"
        Ms:
          type: np.float32
          unit: kA/m
          defaultDisplayUnit: "kA/m"
      sub_sections:
        mammos_entities:
          repeats: true
          section:
            quantities:
              name: {type: str}
              value_key: {type: str}
              source_type: {type: str}
              ontology_label: {type: str}
              ontology_iri: {type: str}
              unit: {type: str}
              description: {type: str}
        # One repeating subsection per UppASD/MC_*/thermal.csv (mammos csv v3):
        # the temperature-dependent quantities ('Temperature-dependent
        # quantities computed with UppASD'). The arrays are written inline
        # (an hdf5.path annotation on the shared quantity definition would
        # fill only the last repeating instance, see runner comment); the h5
        # still carries them under /thermal_MC_<n>/<column> as raw data.
        # The runner extends the quantity list with any extra csv columns.
        thermal_properties:
          repeats: true
          section:
            quantities:
              name: {type: str}
              description: {type: str}
              T: {type: np.float32, shape: ['*'], unit: K, defaultDisplayUnit: "K"}
              Ms: {type: np.float32, shape: ['*'], unit: kA/m, defaultDisplayUnit: "kA/m"}
              Js: {type: np.float32, shape: ['*'], unit: T, defaultDisplayUnit: "T"}
              E: {type: np.float32, shape: ['*'], unit: eV, defaultDisplayUnit: "eV"}
              Cv: {type: np.float32, shape: ['*'], unit: eV/K, defaultDisplayUnit: "eV/K"}
              chi: {type: np.float32, shape: ['*']}
              U_L: {type: np.float32, shape: ['*']}
            sub_sections:
              mammos_entities:
                repeats: true
                section:
                  quantities:
                    name: {type: str}
                    value_key: {type: str}
                    source_type: {type: str}
                    ontology_label: {type: str}
                    ontology_iri: {type: str}
                    unit: {type: str}
                    description: {type: str}
data:
  m_def: Simulation_data_from_UU
  chemical_formula: $chemical_formula$
  data_file: $data_file$
  institute: 'Uppsala University, Department of Physics and Astronomy; Materials Theory'
  lab_id: 'Uppsala_University'
  owner: 'Heike Herper, Mohammad Nur Hassan, Alena Vishina'
  method: 'DFT'
  name: $name$
  short_name: $short_name$

  description: "Data for atomistic and spin-dynamics calculations done within the project MaMMoS at Uppsala University.\nA juypter-notebook showing how to handle the data can be found next to the raw data. \n\nAdditional information on the datasets and corresponding MODA diagrams can be found on https://mammos-project.github.io/resources.html ."

  Js: $Js$
  Js_300: $Js_300$
  Ku: $Ku$
  Tc: $Tc$
  Ms: $Ms$
  mammos_entities: $mammos_entities$
